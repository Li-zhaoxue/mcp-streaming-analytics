services:
  postgres:
    image: postgres:16-alpine
    container_name: streaming-db
    environment:
      POSTGRES_DB: streaming_analytics
      POSTGRES_USER: streaming_user
      POSTGRES_PASSWORD: streaming_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
      - ./database/seeds/01_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming_user -d streaming_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
